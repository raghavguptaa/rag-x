<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account • Rag X</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%238b5cf6'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3ER%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/landing.css">
    <link rel="stylesheet" href="/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="nav" id="nav"></header>

<main class="auth-wrap">
    <section class="auth-card">
        <h1>Create your account</h1>
        <p class="sub">Optional: it lets you track your activity. The tools work without one.</p>

        <form id="registerForm" novalidate>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <div class="pw-wrap">
                    <input type="password" id="password" autocomplete="new-password" required>
                    <button type="button" class="pw-toggle" data-target="password">Show</button>
                </div>
                <div class="meter"><div id="meterBar"></div></div>
                <div class="hint" id="pwHint"></div>
            </div>
            <div class="field">
                <label for="confirm">Confirm password</label>
                <div class="pw-wrap">
                    <input type="password" id="confirm" autocomplete="new-password" required>
                    <button type="button" class="pw-toggle" data-target="confirm">Show</button>
                </div>
            </div>
            <div class="form-error" id="formError" role="alert"></div>
            <button type="submit" class="btn btn-block" id="submitBtn">Create account</button>
        </form>

        <p class="auth-alt">Already have an account? <a href="/login.html">Sign in</a></p>
        <p class="note">Only your email, a hashed password and a metadata-only usage log are stored.</p>
    </section>
</main>
<script src="/nav.js"></script>
<script src="/auth.js"></script>
</body>
</html>
