<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Reset password • Rag X</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%238b5cf6'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3ER%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/landing.css">
    <link rel="stylesheet" href="/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="nav" id="nav"></header>

<main class="auth-wrap">
    <section class="auth-card">
        <h1>Choose a new password</h1>
        <p class="sub">Use at least 10 characters. Signing in again will be required on all devices.</p>

        <form id="resetForm" novalidate>
            <div class="field">
                <label for="password">New password</label>
                <div class="pw-wrap">
                    <input type="password" id="password" autocomplete="new-password" required>
                    <button type="button" class="pw-toggle" data-target="password">Show</button>
                </div>
                <div class="meter"><div id="meterBar"></div></div>
                <div class="hint" id="pwHint"></div>
            </div>
            <div class="field">
                <label for="confirm">Confirm password</label>
                <div class="pw-wrap">
                    <input type="password" id="confirm" autocomplete="new-password" required>
                    <button type="button" class="pw-toggle" data-target="confirm">Show</button>
                </div>
            </div>
            <div class="form-error" id="formError" role="alert"></div>
            <button type="submit" class="btn btn-block" id="submitBtn">Set new password</button>
        </form>

        <div class="ok-box" id="doneBox" hidden>
            <p class="form-ok">Your password has been changed.</p>
            <a href="/login.html" class="btn">Sign in</a>
        </div>

        <div class="ok-box" id="badLink" hidden>
            <p class="form-error">This reset link is missing or invalid.</p>
            <a href="/forgot.html" class="btn">Request a new link</a>
        </div>
    </section>
</main>

<footer class="site-footer" id="footer"></footer>

<script src="/nav.js"></script>
<script src="/footer.js"></script>
<script src="/auth.js"></script>
<script src="/recovery.js"></script>
</body>
</html>
