<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password • Rag X</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%238b5cf6'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3ER%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/landing.css">
    <link rel="stylesheet" href="/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="nav" id="nav"></header>

<main class="auth-wrap">
    <section class="auth-card">
        <h1>Forgot your password?</h1>
        <p class="sub">Enter your account email. If it exists, we'll send a link to choose a new password.</p>

        <form id="forgotForm" novalidate>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="email" required>
            </div>
            <div class="form-error" id="formError" role="alert"></div>
            <button type="submit" class="btn btn-block" id="submitBtn">Send reset link</button>
        </form>

        <div class="ok-box" id="okBox" hidden>
            <p class="form-ok" id="formOk"></p>
            <p class="sub" style="margin-top:12px;">Check your spam folder if you don't see it within a few minutes.</p>
        </div>

        <p class="auth-alt"><a href="/login.html">Back to sign in</a></p>
        <p class="note">The link works once and expires after 30 minutes.</p>
    </section>
</main>

<footer class="site-footer" id="footer"></footer>

<script src="/nav.js"></script>
<script src="/footer.js"></script>
<script src="/recovery.js"></script>
</body>
</html>
